<!DOCTYPE html>
<html>
<head>
    <title>Char Editor</title>
</head>
<body>
    <form method="POST">
        <input name="charname" placeholder="Character Name"><br>
        <input name="str" placeholder="Strength"><br>
        <input name="dex" placeholder="Dexterity"><br>
        <input name="int" placeholder="Intelligence"><br>
        <input name="money" placeholder="Money"><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>

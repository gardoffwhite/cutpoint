<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>
<body>
    <h1>Welcome to the Game Character Management System</h1>

    {% if not session.get("logged_in") %}
        <p><a href="{{ url_for('login') }}">Login</a> to access character management.</p>
    {% else %}
        <p><a href="{{ url_for('charedit') }}">Go to Character Edit</a></p>
        <p><a href="{{ url_for('logout') }}">Logout</a></p>
    {% endif %}
</body>
</html>
